name: responsive_store_dashboard
description: "A responsive store dashboard Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Preview the app on different device frames during development
  device_preview: ^1.2.0

  # Masonry/staggered grid layout for product cards
  flutter_staggered_grid_view: ^0.7.0

  # Render SVG images inside Flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  # This for under line code but not issues
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/jpg/
    - assets/images/png/
    - assets/images/svg/

  fonts:
    # ─── Roboto ───────────────────────────────────────────────────
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto-BlackItalic.ttf
          weight: 900
          style: italic

    # ─── Roboto Condensed ─────────────────────────────────────────
    - family: Roboto Condensed
      fonts:
        - asset: assets/fonts/Roboto_Condensed-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto_Condensed-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto_Condensed-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto_Condensed-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto_Condensed-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto_Condensed-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto_Condensed-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto_Condensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto_Condensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto_Condensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto_Condensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto_Condensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Roboto_Condensed-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto_Condensed-BlackItalic.ttf
          weight: 900
          style: italic

    # ─── Roboto SemiCondensed ─────────────────────────────────────
    - family: Roboto SemiCondensed
      fonts:
        - asset: assets/fonts/Roboto_SemiCondensed-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto_SemiCondensed-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto_SemiCondensed-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto_SemiCondensed-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto_SemiCondensed-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto_SemiCondensed-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto_SemiCondensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto_SemiCondensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto_SemiCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Roboto_SemiCondensed-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto_SemiCondensed-BlackItalic.ttf
          weight: 900
          style: italic
